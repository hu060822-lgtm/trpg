# Render blueprint for the game server. Free plan: no disk is needed because the data lives in Supabase.
# A free service sleeps after 15 minutes without traffic; the first request after that takes about a minute.
services:
  - type: web
    name: fateweave-server
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      # Supabase Session pooler connection string (the direct one is IPv6 only and Render cannot reach it).
      - key: DATABASE_URL
        sync: false
      # Supabase project URL, for verifying sign-ins.
      - key: SUPABASE_URL
        sync: false
      # Supabase anon or publishable key (public). Older projects sign with a shared secret; with this key the server
      # asks Supabase Auth to check those sign-ins, so the secret is not needed.
      - key: SUPABASE_ANON_KEY
        sync: false
      # The GitHub Pages origin, e.g. https://hu060822-lgtm.github.io
      - key: CORS_ORIGINS
        sync: false
      # Main GM of the first world: sb:<your Supabase user id>=main (the lobby shows your id after you sign in).
      - key: INITIAL_GMS
        sync: false
