# Render blueprint for the game server (SQLite on a persistent disk; PostgreSQL is a later step).
services:
  - type: web
    name: fateweave-server
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev
    startCommand: npm run server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: DATABASE_PATH
        value: /var/data/fateweave.db
    disk:
      name: fateweave-data
      mountPath: /var/data
      sizeGB: 1
